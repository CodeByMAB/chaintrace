[project]
name = "chaintrace"
version = "0.1.0"
description = "Modular AI Chain-of-Thought tracer - capture, store, analyze, and visualize reasoning traces from any AI model"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CodeByMAB", email = "mabcode@protonmail.com" },
]
requires-python = ">=3.10"
keywords = ["ai", "llm", "chain-of-thought", "reasoning", "observability", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "orjson>=3.9",
    "python-json-logger>=2.0",
    "pathspec>=0.11",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "hypothesis>=6.88",
    "pytest-mock>=3.12",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings>=0.24",
]
postgresql = [
    "asyncpg>=0.29",
]
cloud = [
    "boto3>=1.34",
    "google-cloud-storage>=2.14",
]
api = [
    "fastapi>=0.109",
    "jinja2>=3.1",
    "websockets>=12.0",
    "uvicorn>=0.25",
]
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
]
bitcoin = [
    # httpx already included - for future Bitcoin-related features
    # Open Timestamps works with core dependencies
]

[project.scripts]
chaintrace = "chaintrace.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaintrace"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["chaintrace"]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/chaintrace"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]